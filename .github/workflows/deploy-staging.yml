# Simulated deploy to staging on every push to staging, then the epic tracker.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy (simulated)
        run: echo "Deploying ${{ github.sha }} to staging"
      - name: Track epics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/track-epics.sh staging "${{ github.sha }}"
